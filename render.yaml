# Render blueprint — free web service, Neon for the database.
#
# Create it with "New → Blueprint" in the dashboard, pointed at this repo. The
# infrastructure is this file: the service, its plan, its health check and every
# variable except the two secrets. Nothing needs configuring by hand afterwards
# beyond pasting those two in.
#
# ── Why there is no `databases:` block ───────────────────────────────────────
#
# The database is Neon, not Render. Render's free Postgres is removed after
# about 30 days, which for a habit tracker means losing history that cannot be
# recovered. Neon's free tier persists.
#
# So DATABASE_URL is `sync: false`: Render prompts for it once when the
# blueprint is created and stores it as a secret. It never enters this file or
# git. Use Neon's DIRECT connection string — the one *without* `-pooler` in the
# hostname. TLS needs no configuration; `resolveSsl` turns it on for any dotted
# host and honours the `sslmode` Neon includes.
#
# ── The database step ────────────────────────────────────────────────────────
#
# `preDeployCommand` needs a paid instance, so on the free plan the schema is
# applied from your own machine against the same connection string:
#
#     DATABASE_URL='postgresql://…neon.tech/neondb?sslmode=require' npm run db:deploy
#
# Run it once before the first deploy, and again after any deploy whose commit
# changes db/schema.sql. It is `db:setup && db:migrate`, both idempotent.
#
# ── What free costs ──────────────────────────────────────────────────────────
#
# The service sleeps after ~15 minutes without traffic and takes about a minute
# to wake. Neon's free tier also suspends after a few minutes idle and wakes on
# the next query, so the first request after a quiet spell pays for both.
#
# ── Upgrading later ──────────────────────────────────────────────────────────
#
#   services[0].plan  free → starter        (no sleeping, SSH, pre-deploy)
#   and add:          preDeployCommand: npm run db:deploy
#
# Nothing in the application changes.

services:
  - type: web
    name: rich-habits
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # SECRET. Neon's direct connection string. Render prompts for it when the
      # blueprint is created; it is never written to this file.
      - key: DATABASE_URL
        sync: false
      # SECRET, and optional. Without it /api/coach answers 501 and nothing
      # else changes. Leave the prompt empty if you do not want the AI coach.
      - key: OPENAI_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "20"
      # Production is production. RH_TEST_INSTANCE is deliberately absent — it
      # stamps every account created as created_via='test', which would make
      # real sign-ups look like fixtures in Admin → Users. The application also
      # refuses to start with it set against a non-local database.
      - key: NODE_ENV
        value: production
      # Stamped onto analytics events. npm_package_version is unset in most
      # production runtimes, so set it explicitly.
      - key: APP_VERSION
        value: "0.1.0"
      # A free instance has 512MB, and Neon's free tier has a modest connection
      # allowance. The app is comfortable with a small pool.
      - key: PG_POOL_MAX
        value: "5"
