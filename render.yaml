# Render blueprint: one web service, one Postgres instance.
# Create it from the dashboard with "New → Blueprint" pointed at this repo.
#
# The schema is applied by `npm run db:setup` as a pre-deploy step. That script
# is idempotent — it checks for the `users` table and does nothing if the
# database is already set up — so it is safe on every deploy, not just the first.
#
# preDeployCommand runs only on paid instance types. On the free tier, remove it
# and run the same command once from the service's Shell tab after the first
# deploy: `npm run db:setup`.
services:
  - type: web
    name: rich-habits
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:setup
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # The internal connection string: same private network, no TLS. pool.ts
      # detects that from the undotted hostname.
      - key: DATABASE_URL
        fromDatabase:
          name: rich-habits-db
          property: connectionString
      - key: NODE_VERSION
        value: "20"
      # Stamped onto analytics events. npm_package_version is unset in most
      # production runtimes, so set it explicitly.
      - key: APP_VERSION
        value: "0.1.0"
      # Optional — the AI coach at /api/coach. Set the value in the dashboard;
      # `sync: false` keeps the secret out of this file and out of git.
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: rich-habits-db
    databaseName: richhabits
    user: richhabits
    plan: basic-256mb
    region: oregon
